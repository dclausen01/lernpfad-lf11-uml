- id: q-zpa-katalog
  titel: "ZPA Nord-West: Prüfungskatalog für die IHK-Abschlussprüfung Fachinformatiker/-in Anwendungsentwicklung, 2. Auflage, Stand 2024-10-07 (u-form Verlag, Best.-Nr. 6392)"
  url: https://www.u-form-shop.de
  art: lehrplan
  status: verifiziert
  geprueft_am: 2026-10-29
  belegt: >-
    AP2-Prüfungsbereiche „Planen eines Softwareproduktes“ und „Entwicklung und Umsetzung von Algorithmen“
    (je 90 Minuten, vier ungebundene Aufgaben, je 10 %). UML in AP2: Klassen-, Anwendungsfall-, Aktivitäts-,
    Sequenz- und Zustandsdiagramm (Fragenkomplexe 03 und 04); in AP1: Anwendungsfall-, Klassen-,
    Aktivitätsdiagramm. Notationsblatt im Anhang (S. 40–42): {static}/{final} als Eigenschaften, Implementierung,
    Konnektoren, [else], loop(10), create gestrichelt, after(Zeitdauer). Kein Komponenten-, Verteilungs- oder
    Objektdiagramm.
